# RoutineLens — ofis içi (LAN) kurulumu
#
#   cp .env.example .env      # önce örnek ayarı kopyalayıp düzenleyin (Windows: copy .env.example .env)
#   docker compose up --build -d
#
#   Panel  : http://localhost:8501
#   API    : http://localhost:8000  (dokümantasyon: http://localhost:8000/docs)
#
# Gizli değerler (örn. yönetici şifresi) kök dizindeki ".env" dosyasından okunur.
# ".env" yoksa varsayılanlar kullanılır (geliştirme amaçlı).
#
# NOT: Kamera/YOLO burada ÇALIŞMAZ. O kısım her çalışanın kendi bilgisayarında
# native olarak çalışır (main.py) ve bu API'ye yalnızca JSON verisi gönderir.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ROUTINELENS_DB: /data/routinelens.db
      ROUTINELENS_KAYIT: /data/kayitlar
    volumes:
      - routinelens-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      ROUTINELENS_DB: /data/routinelens.db
      ROUTINELENS_KAYIT: /data/kayitlar
    volumes:
      - routinelens-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  routinelens-data:
